const $ = s => document.querySelector(s);
const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const memory = new Map();
let storageFailed = false;
function read(key, fallback, session=false) {
 try { const value=(session?sessionStorage:localStorage).getItem(key); return value?JSON.parse(value):fallback; }
 catch { storageFailed=true; return memory.get(key) ?? fallback; }
}
function write(key,value,session=false) {
 memory.set(key,value);
 try {(session?sessionStorage:localStorage).setItem(key,JSON.stringify(value));}
 catch {storageFailed=true;}
 showStorage();
}
const KEY='rek-html-v1-';
let lang=read(KEY+'lang','ru');
if(!['ru','en','he'].includes(lang))lang='ru';
const t = key => TEXT[key][['ru','en','he'].indexOf(lang)];
let users=read(KEY+'users',[]);
if(!Array.isArray(users))users=[];
let user=users.find(u=>u.id===read(KEY+'session',null,true)) || null;
let early=read(KEY+'early',false,true)===true;
let run=read(KEY+'run',null,true);
if(!user || run?.userId!==user.id || !Array.isArray(run?.answers))run=null;
let page=run&&!run.done?'game':'home',mode='register',photo='',draftNick='',draftPass='';
const allowed=()=>early||Date.now()>=OPEN_AT;
function showStorage(){const n=$('#storageNotice');if(n){n.textContent=t('noStorage');n.classList.toggle('hidden',!storageFailed);}}
function saveRun(){write(KEY+'run',run,true);}
function avatar(u){const image=/^data:image\/jpeg;base64,[a-zA-Z0-9+/=]+$/.test(u?.photo||'');return `<span class="avatar">${image?`<img src="${escapeHTML(u.photo)}" alt="">`:escapeHTML((u?.nick||'?').slice(0,1).toUpperCase())}</span>`;}
function chips(){return `<div class="chips"><span class="chip">${t('questions')}</span><span class="chip">${t('time')}</span><span class="chip">${t('languages')}</span></div>`;}
function button(action,key,primary=false){return `<button data-action="${action}" class="${primary?'primary':'quiet'}">${t(key)}</button>`;}
function locked(){return `<section class="card glass center"><div class="eyebrow">${t('soon')}</div><div class="orb"><span>✦</span></div><h1>${t('title')}</h1><p style="max-width:560px;margin:0 auto">${t('closed')}</p><div class="countdown" id="countdown"></div><div class="small">${t('countdown')}</div><p class="date" style="margin-top:24px">${t('date')}</p>${chips()}</section>`;}
function auth(){return `<section class="card glass split"><div><div class="eyebrow">${t('school')}</div><h1>${t('title')}</h1><p>${t('about')}</p>${chips()}<p class="small">${t('local')}</p></div><div><div class="tabs">${['register','login'].map(m=>`<button data-mode="${m}" class="${mode===m?'active':''}">${t(m)}</button>`).join('')}</div><form id="authForm"><label for="nick">${t('nick')}</label><input id="nick" name="nick" minlength="2" maxlength="24" required autocomplete="username" value="${escapeHTML(draftNick)}"><label for="password">${t('password')}</label><input id="password" name="password" type="password" minlength="6" maxlength="72" required autocomplete="${mode==='register'?'new-password':'current-password'}" value="${escapeHTML(draftPass)}">${mode==='register'?`<label for="photo">${t('photo')}</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div id="photoStatus" class="small">${photo?t('photoReady'):''}</div>`:''}<button class="primary" type="submit">${t(mode)}</button><p class="error" id="authError" role="alert"></p></form></div></section>`;}
function home(){return `<section class="card glass center narrow"><div class="profile">${avatar(user)}<div><div class="small">${t('hello')}</div><h2><bdi>${escapeHTML(user.nick)}</bdi></h2></div></div><h2>${t('ready')}</h2><p>${t('rules')}</p>${chips()}<div class="actions">${button('start','start',true)}${button('board','board')}</div><p class="small" style="margin-top:24px">${t('local')}</p></section>`;}
function question(){const q=QUESTIONS[run.index],a=run.answers[run.index];return `<section class="card glass"><div class="game-top"><div><div class="eyebrow" style="margin-bottom:7px">${t('question')} ${run.index+1} / 15</div><span>${t('points')}: <b>${run.score}</b></span></div><div class="timer" id="timer" role="timer" aria-label="${t('seconds')}">30</div></div><div class="progress"><i id="progress"></i></div><h2 tabindex="-1" id="questionTitle">${escapeHTML(q.q[lang])}</h2><div class="options">${q.opts[lang].map((opt,i)=>`<button class="option ${a?(i===q.answer?'correct':i===a.choice?'wrong':''):''}" data-choice="${i}" ${a?'disabled':''}><b>${lang==='he'?['א','ב','ג','ד'][i]:['A','B','C','D'][i]}</b><span>${escapeHTML(opt)} ${a&&i===q.answer?'✓':''}${a&&i===a.choice&&i!==q.answer?'✕':''}</span></button>`).join('')}</div><div class="feedback" role="status">${a?`${a.choice===null?t('timeout'):a.correct?t('correct'):t('incorrect')} ${a.points?'+'+a.points:''}`:''}</div><p class="small" style="margin:0">${t('time')}</p></section>`;}
function compare(a,b){return b.score-a.score||b.correct-a.correct||a.elapsed-b.elapsed||a.finished-b.finished;}
function ranking(){return users.filter(u=>u.best).map(u=>({...u,...u.best})).sort(compare);}
function board(){const rows=ranking();return `<section class="card glass"><div class="center"><div class="eyebrow">REK QUIZ</div><h1>${t('winners')}</h1><p>${t('localBoard')}</p></div>${!rows.length?`<p class="center">${t('empty')}</p>`:`<div class="podium">${rows.slice(0,3).map((u,i)=>`<div class="pod ${['first','second','third'][i]}"><div class="medal">${['🥇','🥈','🥉'][i]}</div>${avatar(u)}<div class="name"><bdi>${escapeHTML(u.nick)}</bdi></div><strong>${u.score}</strong><div class="small">${t('points')}</div></div>`).join('')}</div>${rows.slice(3).map((u,i)=>`<div class="row"><span>${i+4}</span>${avatar(u)}<span class="name"><bdi>${escapeHTML(u.nick)}</bdi></span><strong>${u.score}</strong></div>`).join('')}`}<div class="actions">${button('home','home')}</div></section>`;}
function results(){return `<section class="card glass center"><div class="orb"><span>✧</span></div><div class="eyebrow">${t('result')}</div><h1>${t('complete')}</h1><div class="metrics"><div class="metric"><strong>${run.score}</strong><span class="small">${t('points')}</span></div><div class="metric"><strong>${run.correct} / 15</strong><span class="small">${t('right')}</span></div></div><div class="actions">${button('board','board',true)}${button('start','again')}${button('home','home')}</div><details class="review"><summary>${t('review')}</summary>${QUESTIONS.map((q,i)=>{const a=run.answers[i];return `<article><h3>${i+1}. ${escapeHTML(q.q[lang])}</h3><p>${t('yours')}: ${a.choice===null?t('noAnswer'):escapeHTML(q.opts[lang][a.choice])} ${a.correct?'✓':'✕'}</p><p>${t('rightAnswer')}: ${escapeHTML(q.opts[lang][q.answer])}</p><a href="${q.source}" target="_blank" rel="noopener noreferrer">${t('source')} ↗</a></article>`;}).join('')}</details></section>`;}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 $('#footer').textContent=t('footer');$('#menu').setAttribute('aria-label',t('menu'));
 $('#menu').disabled=page==='game'&&allowed();
 $('#view').innerHTML=!allowed()?locked():!user?auth():page==='game'?question():page==='board'?board():page==='results'&&run?.done?results():home();
 showStorage();updateClock();
}
function updateClock(){
 if(!allowed()){
  const el=$('#countdown');if(el){let n=Math.max(0,Math.floor((OPEN_AT-Date.now())/1000));el.textContent=[Math.floor(n/86400),Math.floor(n%86400/3600),Math.floor(n%3600/60),n%60].map(n=>String(n).padStart(2,'0')).join(' : ');}return;
 }
 if($('#countdown')){render();return;}
 if(page!=='game'||!run||run.done)return;
 const left=run.answers[run.index]?0:Math.max(0,run.deadline-Date.now());
 if($('#timer')){$('#timer').textContent=Math.ceil(left/1000);$('#timer').classList.toggle('urgent',left<10000);}
 if($('#progress'))$('#progress').style.width=(left/(SECONDS*1000)*100)+'%';
}
const hex=bytes=>Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
async function hashPassword(password,salt){
 if(!globalThis.crypto?.subtle)throw new Error(t('crypto'));
 const enc=new TextEncoder();
 const key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);
 return hex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256)));
}
let authBusy=false,photoBusy=false;
async function signIn(form){
 if(authBusy||photoBusy)return;
 const nick=form.nick.value.trim(),password=form.password.value;
 const error=$('#authError');error.textContent='';
 if(nick.length<2||nick.length>24){error.textContent=t('nickRule');return;}
 if(password.length<6||password.length>72){error.textContent=t('passRule');return;}
 authBusy=true;const submit=form.querySelector('button[type=submit]');submit.disabled=true;submit.textContent=t('wait');
 try{
  const found=users.find(u=>u.nick.toLocaleLowerCase()===nick.toLocaleLowerCase());
  if(mode==='register'){
   if(found)throw new Error(t('exists'));
   if(!globalThis.crypto?.subtle)throw new Error(t('crypto'));
   const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
   const hash=await hashPassword(password,salt);
   user={id:hex(crypto.getRandomValues(new Uint8Array(12))),nick,hash,salt,photo,best:null};
   users.push(user);write(KEY+'users',users);
  }else{
   if(!found||await hashPassword(password,found.salt)!==found.hash)throw new Error(t('invalid'));
   user=found;
  }
  draftNick='';draftPass='';photo='';run=null;saveRun();write(KEY+'session',user.id,true);page='home';render();
 }catch(e){error.textContent=e.message;}finally{authBusy=false;submit.disabled=false;submit.textContent=t(mode);}
}
async function readPhoto(file){
 if(!file)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){$('#authError').textContent=t('badPhoto');return;}
 photoBusy=true;$('#photoStatus').textContent=t('wait');
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
  const ctx=canvas.getContext('2d'),s=Math.min(img.naturalWidth,img.naturalHeight);
  ctx.fillStyle='#202943';ctx.fillRect(0,0,256,256);ctx.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,256,256);
  photo=canvas.toDataURL('image/jpeg',.8);$('#photoStatus').textContent=t('photoReady');$('#authError').textContent='';
 }catch{$('#authError').textContent=t('badPhoto');$('#photoStatus').textContent='';}
 finally{URL.revokeObjectURL(url);photoBusy=false;}
}
function start(){
 if(!user||!allowed())return;
 run={userId:user.id,index:0,answers:[],score:0,correct:0,elapsed:0,deadline:Date.now()+SECONDS*1000,nextAt:0,done:false};
 page='game';saveRun();render();$('#questionTitle')?.focus();
}
function record(choice,at){
 const correct=choice===QUESTIONS[run.index].answer;
 const elapsed=choice===null?SECONDS*1000:Math.max(0,Math.min(SECONDS*1000,at-(run.deadline-SECONDS*1000)));
 const points=correct?1000+Math.max(0,Math.ceil((SECONDS*1000-elapsed)/100)):0;
 run.answers.push({choice,correct,points});run.score+=points;run.correct+=Number(correct);run.elapsed+=elapsed;
 run.nextAt=at+1600;saveRun();
}
function advance(){
 if(page!=='game'||!run||run.done)return;
 const now=Date.now();let changed=false;
 for(let guard=0;guard<32;guard++){
  if(!run.answers[run.index]){if(now<run.deadline)break;record(null,run.deadline);changed=true;}
  if(now<run.nextAt)break;
  if(run.index===QUESTIONS.length-1){finish();return;}
  run.index++;run.deadline=run.nextAt+SECONDS*1000;run.nextAt=0;changed=true;saveRun();
 }
 if(changed)render();updateClock();
}
function choose(choice){
 const index=run?.index;
 advance();if(page!=='game'||run.done||run.index!==index||run.answers[run.index])return;
 record(choice,Date.now());render();
}
function finish(){
 run.done=true;run.finished=run.nextAt;
 if(!user.best||compare(run,user.best)<0){user.best={score:run.score,correct:run.correct,elapsed:run.elapsed,finished:run.finished};write(KEY+'users',users);}
 saveRun();page='results';render();celebrate();
}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti');c.innerHTML=Array.from({length:38},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#c5b2ff','#a4f2d8','#f8d69e'][i%3]};animation-delay:${Math.random()*.7}s"></i>`).join('');setTimeout(()=>c.replaceChildren(),4000);}
function menu(){
 if(page==='game'&&allowed())return;
 const d=$('#dialog');d.innerHTML=`<div class="dialog-head"><h2>${allowed()?t('menu'):t('early')}</h2><button id="closeDialog" aria-label="${t('close')}">×</button></div>${!allowed()?`<form id="unlockForm"><label for="access">${t('code')}</label><input id="access" type="password" inputmode="numeric" required autocomplete="off"><button class="primary" type="submit">${t('unlock')}</button><p class="error" id="unlockError" role="alert"></p></form>`:`<div class="actions">${user?button('logout','logout'):''}${early?button('relock','relock'):''}</div><p class="small" style="margin-top:20px">${t('local')}</p>`}`;
 d.showModal();$('#access')?.focus();
}
function logOut(){user=null;run=null;page='home';draftPass='';write(KEY+'session',null,true);saveRun();render();}
document.addEventListener('submit',event=>{
 event.preventDefault();
 if(event.target.id==='authForm')signIn(event.target);
 if(event.target.id==='unlockForm'){
  if($('#access').value.trim()!==ACCESS_CODE){$('#unlockError').textContent=t('wrongCode');return;}
  early=true;write(KEY+'early',true,true);$('#dialog').close();render();
 }
});
document.addEventListener('change',e=>{if(e.target.id==='photo')readPhoto(e.target.files[0]);});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.lang){
  if(authBusy||photoBusy)return;
  if($('#nick')){draftNick=$('#nick').value;draftPass=$('#password').value;}
  lang=b.dataset.lang;write(KEY+'lang',lang);advance();render();if($('#dialog').open){$('#dialog').close();menu();}return;
 }
 if(b.dataset.mode){if(authBusy||photoBusy)return;draftNick=$('#nick').value;draftPass=$('#password').value;mode=b.dataset.mode;render();return;}
 if(b.id==='menu'){menu();return;}
 if(b.id==='closeDialog'){$('#dialog').close();return;}
 if(b.dataset.choice!==undefined){choose(Number(b.dataset.choice));return;}
 const action=b.dataset.action;
 if(action==='start')start();
 if(action==='board'){page='board';render();}
 if(action==='home'){page='home';render();}
 if(action==='logout'){$('#dialog').close();logOut();}
 if(action==='relock'){early=false;write(KEY+'early',false,true);$('#dialog').close();logOut();}
});
document.addEventListener('visibilitychange',()=>{advance();updateClock();});
window.addEventListener('pageshow',()=>{advance();updateClock();});
render();advance();setInterval(()=>{advance();updateClock();},100);
</script>
